# Asserts a control that only has an accessibility label (an icon button's
# aria-label) is on screen. iOS exposes it as the element's label; Android's
# DevTools hierarchy as its id (its text "Back" would also match Android's own
# navigation bar). env LABEL: regex.
appId: ${APP_ID}
---
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: ${LABEL}
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: ${LABEL}
