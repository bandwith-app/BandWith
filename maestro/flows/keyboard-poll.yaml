# On-screen keyboard (#180, #186), the poll location. A field is focused and typed in;
# the keyboard probe (setup/bw-maestro-setup.js, subflows/type-and-check.yaml)
# checks the keyboard came up, the field is in sight above it, not covered,
# and got there in one move (no jump).
# Phones: the BACK / PUBLISH POLL bar steps aside for the keyboard and comes
# back with it closed.
appId: ${APP_ID}
# Android: read the WebView through Chrome DevTools (the accessibility tree
# lags behind layers that open); needs the debug build (CAP_DEBUG).
androidWebViewHierarchy: devtools
name: keyboard-poll
tags: [ios, android, keyboard]
---
- runFlow: ../subflows/start.yaml
- runFlow: ../subflows/open-poll-builder.yaml
- runFlow:
    file: ../subflows/type-and-check.yaml
    env:
      FIELD: "e.g. Blackbox Studios · room 2|Location / studio"
      TEXT: "Room 2"
      SHOT: keyboard-poll-01-location
- runFlow:
    when:
      true: ${FORM == 'phone'}
    commands:
      - assertNotVisible: "(?i)publish poll"
      - runFlow:
          file: ../subflows/hide-keyboard.yaml
          env:
            BLUR: "(?i)availability poll"
      - assertVisible: "(?i)publish poll"
