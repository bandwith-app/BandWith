# On-screen keyboard (#180, #186), Create contract. A field is focused and typed in;
# the keyboard probe (setup/bw-maestro-setup.js, subflows/type-and-check.yaml)
# checks the keyboard came up, the field is in sight above it, not covered,
# and got there in one move (no jump).
# The client email sits where the keyboard comes up on phones (the notes box:
# keyboard-contract-notes).
appId: ${APP_ID}
# Android: read the WebView through Chrome DevTools (the accessibility tree
# lags behind layers that open); needs the debug build (CAP_DEBUG).
androidWebViewHierarchy: devtools
name: keyboard-contract
tags: [ios, android, keyboard]
---
- runFlow: ../subflows/start.yaml
- runFlow:
    file: ../subflows/open-event.yaml
    env:
      TITLE: rooftop session
- scrollUntilVisible:
    element: "No contract yet.*"
    timeout: 40000
- tapOn: "No contract yet.*"
- assertVisible: "(?i)create contract"
- runFlow:
    file: ../subflows/type-and-check.yaml
    env:
      FIELD: "(?i)events@aurora\\.example.*"
      TEXT: "m"
      SHOT: keyboard-contract-01-email
