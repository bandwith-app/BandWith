<!-- Google Analytics 4, Consent Mode v2 basic (src/ui/consent.ts): everything denied, and gtag.js is fetched only after Accept; no ad features. -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag('consent', 'default', { analytics_storage: 'denied', ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied' });
  gtag('set', 'ads_data_redaction', true);
  /* Configured and loaded only after a yes, so the first page_view is already consented. */
  window.bwLoadGa = function () {
    if (document.getElementById('bw-gtag')) return;
    gtag('js', new Date());
    gtag('config', 'G-GCWSEQRZ2E', { allow_google_signals: false, allow_ad_personalization_signals: false, debug_mode: /[?&]ga_debug=1/.test(location.search) || undefined });
    var s = document.createElement('script');
    s.id = 'bw-gtag'; s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=G-GCWSEQRZ2E';
    document.head.appendChild(s);
  };
  (function () {
    var c = null; try { c = localStorage.getItem('bw-site-consent'); } catch (e) {}
    document.documentElement.setAttribute('data-consent', c === 'granted' || c === 'denied' ? c : 'pending');
    if (c === 'granted') { gtag('consent', 'update', { analytics_storage: 'granted' }); window.bwLoadGa(); }
  })();
</script>
<script>
  (function () {
    var d = document.documentElement;
    d.classList.add('js');
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) d.classList.add('has-motion');
    // Safety net: never leave content hidden if the page script fails.
    setTimeout(function () { if (!window.__bwReady) d.classList.remove('has-motion'); }, 4000);
  })();
</script>
