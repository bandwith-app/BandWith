name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Lifecycle model docs (docs/lifecycles) match the models in e2e/models.
      - run: pnpm e2e:models:docs --check
      - run: pnpm test:run
      - run: pnpm build
      # Product site (site/): its own static build.
      - run: pnpm build:site

  e2e:
    name: E2E (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-webkit
      - name: Install browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit
      # apt on the runner sometimes hangs for 20+ minutes: bound each try, retry.
      - name: Install browser system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: |
          for i in 1 2 3; do
            timeout 360 pnpm exec playwright install-deps chromium webkit && exit 0
            echo "install-deps try $i failed or timed out, retrying"
          done
          exit 1
      - run: pnpm e2e:typecheck
      # The lifecycle model paths run in the "E2E lifecycles" job.
      - run: pnpm e2e --shard=${{ matrix.shard }}/3
        env:
          E2E_SKIP_LIFECYCLES: 1
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            e2e/.report/
            e2e/.results/
          retention-days: 7

  # Lifecycle model paths (e2e/models → specs/xstate-lifecycles.spec.ts),
  # beside the shards instead of inside them. Same setup as the shards.
  e2e-lifecycles:
    name: E2E lifecycles
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-webkit
      - name: Install browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit
      # apt on the runner sometimes hangs for 20+ minutes: bound each try, retry.
      - name: Install browser system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: |
          for i in 1 2 3; do
            timeout 360 pnpm exec playwright install-deps chromium webkit && exit 0
            echo "install-deps try $i failed or timed out, retrying"
          done
          exit 1
      - run: pnpm e2e:typecheck
      - run: pnpm e2e specs/xstate-lifecycles.spec.ts
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-lifecycles
          path: |
            e2e/.report/
            e2e/.results/
          retention-days: 7
