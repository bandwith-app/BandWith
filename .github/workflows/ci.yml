name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Lifecycle model docs (docs/lifecycles) match the models in e2e/models.
      - run: pnpm e2e:models:docs --check
      - run: pnpm test:run
      # The web build: the app, the Academy and its static pages (academy/seo).
      - run: pnpm build:web
      - run: test -f dist/academy/en/a/create-a-gig/index.html && test -f dist/robots.txt && test -f dist/academy/sitemap.xml
      # Product site (site/): its own static build.
      - run: pnpm build:site

  # Every supabase/tests/*.pglite.mjs suite (supabase/tests/pglite-runner/run.mjs).
  # fetch-depth 0: suites that read a release migration not merged yet do it
  # with git show origin/<branch>; their failures warn until that branch is
  # merged, and the run turns strict once every migration of
  # supabase/checks/release-sources.txt is on main.
  pglite:
    name: PGlite suites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: supabase/tests/pglite-runner/package-lock.json
      - run: npm ci --prefix supabase/tests/pglite-runner --ignore-scripts
      - run: node supabase/tests/pglite-runner/run.mjs

  # Which areas a pull request touches: the app's E2E shards and lifecycles
  # are skipped when it only changes docs/ or site/ (scripts/ci-changed-areas.mjs).
  # Pushes to main always run everything.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.areas.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "origin/$BASE...HEAD" | tee /dev/stderr | node scripts/ci-changed-areas.mjs >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # The app's Playwright specs, split over 8 shards (standard runners are free
  # for this public repo; 3 shards took 40-50 minutes and hit the timeout).
  e2e:
    name: E2E (${{ matrix.shard }}/8)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-setup
      # The lifecycle model paths run in the "E2E lifecycles" job.
      - run: pnpm e2e --shard=${{ matrix.shard }}/8
        env:
          E2E_SKIP_LIFECYCLES: 1
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            e2e/.report/
            e2e/.results/
          retention-days: 7
          # Dot folders: upload-artifact@v4 skips hidden files unless asked.
          include-hidden-files: true

  # Lifecycle model paths (e2e/models → specs/xstate-lifecycles.spec.ts),
  # beside the shards instead of inside them. Same setup as the shards.
  e2e-lifecycles:
    name: E2E lifecycles
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-setup
      - run: pnpm e2e specs/xstate-lifecycles.spec.ts
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-lifecycles
          path: |
            e2e/.report/
            e2e/.results/
          retention-days: 7
          # Dot folders: upload-artifact@v4 skips hidden files unless asked.
          include-hidden-files: true

  # Product site (site/): languages, the language suggestion, translated scripts.
  # Always runs: it is the only E2E job left for a site-only change.
  e2e-site:
    name: E2E site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-setup
      - run: pnpm e2e:site
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-site
          path: |
            e2e/.report/
            e2e/.results-site/
          retention-days: 7
          # Dot folders: upload-artifact@v4 skips hidden files unless asked.
          include-hidden-files: true

  # The one required E2E check on main: green when every E2E job passed, or was
  # skipped on purpose by "Changed areas". Shard counts can change without
  # touching branch protection.
  e2e-gate:
    name: E2E
    if: always()
    needs: [changes, e2e, e2e-lifecycles, e2e-site]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes: $CHANGES · all: $RESULTS"
          # A failed or cancelled "Changed areas" skips the shards: that is not a pass.
          [ "$CHANGES" = "success" ] || { echo "Changed areas did not succeed: $CHANGES"; exit 1; }
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "An E2E job did not pass: $r"; exit 1 ;;
            esac
          done
