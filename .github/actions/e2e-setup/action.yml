name: E2E setup
description: Node, pnpm, the dependencies, the Playwright browsers with their system packages, and the e2e typecheck. Run after actions/checkout.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - name: Playwright version
      id: pw
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      id: pw-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-webkit
    - name: Install browsers
      if: steps.pw-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium webkit
    # The runner's Ubuntu mirror can crawl (~50 KB/s for ~436 MB of browser
    # deps): keep the downloaded .deb files between runs so apt only installs.
    - name: Cache browser system packages
      if: steps.pw-cache.outputs.cache-hit == 'true'
      uses: actions/cache@v4
      with:
        path: ~/apt-debs
        key: apt-debs-${{ runner.os }}-${{ steps.pw.outputs.version }}-v1
    - name: Install browser system deps
      if: steps.pw-cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99bw-keep-debs >/dev/null
        sudo rm -f /etc/apt/apt.conf.d/docker-clean
        if compgen -G "$HOME/apt-debs/*.deb" >/dev/null; then sudo cp "$HOME"/apt-debs/*.deb /var/cache/apt/archives/; fi
        ok=0
        for i in 1 2 3; do
          # Retries go to another mirror (the default one is sometimes very slow).
          if [ "$i" = 2 ] && [ -f /etc/apt/apt-mirrors.txt ]; then echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null; fi
          if [ "$i" = 3 ] && [ -f /etc/apt/apt-mirrors.txt ]; then echo "http://azure.archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null; fi
          if sudo timeout -k 10 480 env "PATH=$PATH" pnpm exec playwright install-deps chromium webkit; then ok=1; break; fi
          echo "install-deps try $i failed or timed out, retrying"
          sudo pkill -9 -x apt-get || true
          sudo pkill -9 -x dpkg || true
          sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock
          sudo dpkg --configure -a || true
        done
        mkdir -p "$HOME/apt-debs"
        cp /var/cache/apt/archives/*.deb "$HOME/apt-debs/" 2>/dev/null || true
        [ "$ok" = 1 ]
    - run: pnpm e2e:typecheck
      shell: bash
